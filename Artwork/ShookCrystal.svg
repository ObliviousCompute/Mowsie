<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 312 750" width="312" height="750" role="img" aria-label="Mowsie crystal, quiet ember">
  <title>Mowsie Crystal — Quiet Ember</title>
  <!-- Same geometry in both states; gradients are contained within the stone. -->
  <defs>
    <linearGradient id="facet0" x1="0%" y1="0%" x2="50%" y2="100%"><stop offset="0" stop-color="#69b6ad"/><stop offset="1" stop-color="#173c60"/></linearGradient>
<linearGradient id="facet1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0" stop-color="#294968"/><stop offset="1" stop-color="#091c35"/></linearGradient>
<linearGradient id="facet2" x1="0%" y1="0%" x2="50%" y2="100%"><stop offset="0" stop-color="#89c2b3"/><stop offset="1" stop-color="#21445e"/></linearGradient>
<linearGradient id="facet3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0" stop-color="#1a3d5d"/><stop offset="1" stop-color="#0b233d"/></linearGradient>
<linearGradient id="facet4" x1="0%" y1="0%" x2="50%" y2="100%"><stop offset="0" stop-color="#337a81"/><stop offset="1" stop-color="#11283d"/></linearGradient>
<linearGradient id="facet5" x1="0%" y1="0%" x2="50%" y2="100%"><stop offset="0" stop-color="#2e6a7c"/><stop offset="1" stop-color="#1d3d5a"/></linearGradient>
<linearGradient id="facet6" x1="0%" y1="0%" x2="50%" y2="100%"><stop offset="0" stop-color="#426e80"/><stop offset="1" stop-color="#80bdac"/></linearGradient>
<linearGradient id="facet7" x1="100%" y1="25%" x2="0%" y2="85%"><stop offset="0" stop-color="#27506a"/><stop offset="1" stop-color="#21566c"/></linearGradient>
    <clipPath id="stoneClip"><path d="M 158 16 L 286 344 L 264 556 L 246 631 L 158 731 L 80 633 L 55 537 L 26 429 L 28 276 Z"/></clipPath>

    <radialGradient id="emberHalo" gradientUnits="userSpaceOnUse" cx="149" cy="414" r="96" gradientTransform="translate(0 70.38) scale(1 0.83)">
      <stop offset="0%" stop-color="#ff65b1" stop-opacity="0.580"/>
      <stop offset="24%" stop-color="#e44a9e" stop-opacity="0.313"/>
      <stop offset="64%" stop-color="#be347f" stop-opacity="0.087"/>
      <stop offset="100%" stop-color="#9d346c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emberHeart" gradientUnits="userSpaceOnUse" cx="149" cy="414" r="30.7">
      <stop offset="0%" stop-color="#ffabd0" stop-opacity="0.520"/>
      <stop offset="40%" stop-color="#fa60b0" stop-opacity="0.208"/>
      <stop offset="100%" stop-color="#fa60b0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#stoneClip)">
    <path d="M 158 16 L 286 344 L 264 556 L 246 631 L 158 731 L 80 633 L 55 537 L 26 429 L 28 276 Z" fill="#132b49"/>
    <polygon points="158,16 28,276 84,256 163,143" fill="url(#facet0)"/>
<polygon points="158,16 163,143 84,256 204,389 286,344" fill="url(#facet1)"/>
<polygon points="28,276 26,429 84,256" fill="url(#facet2)"/>
<polygon points="84,256 26,429 55,537 151,663 204,389" fill="url(#facet3)"/>
<polygon points="204,389 151,663 264,556 286,344" fill="url(#facet4)"/>
<polygon points="55,537 80,633 151,663" fill="url(#facet5)"/>
<polygon points="80,633 158,731 151,663" fill="url(#facet6)"/>
<polygon points="151,663 158,731 246,631 264,556" fill="url(#facet7)"/>

    <!-- Ember remains under the original facet seams, entirely within the crystal outline. -->
    <g clip-path="url(#stoneClip)">
      <path d="M84 256 L26 429 L55 537 L151 663 L204 389 Z" fill="url(#emberHalo)"/>
      <path d="M204 389 L151 663 L264 556 L286 344 Z" fill="url(#emberHalo)"/>
      <path d="M158 16 L163 143 L84 256 L204 389 L286 344 Z" fill="url(#emberHalo)"/>
      <ellipse cx="149" cy="414" rx="33.6" ry="34.6" fill="url(#emberHeart)"/>
      
    </g>
    <g fill="none" stroke="#8eb8c0" stroke-width="2" opacity=".66" stroke-linejoin="round" stroke-linecap="round">
      <path d="M 158 16 L 163 143 L 84 256"/>
<path d="M 28 276 L 84 256 L 204 389 L 286 344"/>
<path d="M 84 256 L 26 429 L 55 537 L 151 663"/>
<path d="M 204 389 L 151 663 L 158 731"/>
<path d="M 151 663 L 80 633"/>
<path d="M 151 663 L 264 556"/>
    </g>
    <g fill="none" stroke="#def4ec" stroke-width="1" opacity=".42" stroke-linecap="round">
      <path d="M 146 45 L 45 277 L 43 320" />
      <path d="M 168 49 L 270 331" />
      <path d="M 258 570 L 240 627 L 167 717" />
    </g>
  </g>
  <path d="M 158 16 L 286 344 L 264 556 L 246 631 L 158 731 L 80 633 L 55 537 L 26 429 L 28 276 Z" fill="none" stroke="#9dcbc9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
